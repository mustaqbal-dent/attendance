<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#137d87">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>نظام الحضور والغياب</title>
<style>
  html, body { margin: 0; height: 100%; background: #e6f3f4; font-family: system-ui, "Segoe UI", Tahoma, sans-serif; }
  #wait { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #0d5f67; text-align: center; padding: 16px; }
  /* credentialless: يفتح النظام بدون حسابات Google المسجّلة في المتصفح،
     فلا يظهر خطأ "يتعذر فتح الملف" في كروم عند وجود أكثر من حساب */
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; opacity: 0; }
  iframe.ready { opacity: 1; }
</style>
</head>
<body>
<div id="wait">جارٍ فتح نظام الحضور والغياب…<br>🤲✨ «اللهم يسّر لنا دروب الخير، وبارك لنا في الجهد، واجعل القادم أجمل مما نتمنى.» 🌿</div>
<iframe credentialless title="نظام الحضور والغياب" allow="clipboard-write"></iframe>
<script>
  const frame = document.querySelector('iframe');
  frame.onload = () => frame.classList.add('ready');
  frame.src = 'https://script.google.com/macros/s/AKfycbzsUaT9Y2fkIq37SrVLrX6EkMrhUFBm9YXGznF0RUxsh1G6QUMxw1Qgsi0Ywh4fyieO/exec'; // يُضبط بعد credentialless حتى يُطبَّق من أول طلب

  // بقاء الجلسة ساعة عند تحديث الصفحة: تخزين الإطار credentialless يُمحى مع كل تحديث،
  // فيطلب النظام من هذه الصفحة حفظ رمز الجلسة (sessionStorage: يُمحى بإغلاق التبويب).
  addEventListener('message', e => {
    const d = e.data;
    if (!d || d.att !== 1 || !/^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/.test(e.origin)) return;
    let v = null;
    try {
      if (d.op === 'set' && typeof d.v === 'string' && d.v.length < 500) sessionStorage.setItem('att_sess', d.v);
      else if (d.op === 'clear') sessionStorage.removeItem('att_sess');
      else if (d.op === 'get') v = sessionStorage.getItem('att_sess');
    } catch (_) {}
    e.source.postMessage({ att: 1, id: d.id, v }, e.origin);
  });
</script>
</body>
</html>
