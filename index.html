<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#137d87">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>نظام الحضور والغياب</title>
<style>
  html, body { margin: 0; height: 100%; background: #e6f3f4; font-family: system-ui, "Segoe UI", Tahoma, sans-serif; }
  #wait { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 10px; color: #0d5f67; text-align: center; padding: 16px; }
  #wait a { color: #137d87; font-size: .9rem; }
  /* credentialless: يفتح النظام بدون حسابات Google المسجّلة في المتصفح،
     فلا يظهر خطأ "يتعذر فتح الملف" في كروم عند وجود أكثر من حساب */
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; opacity: 0; pointer-events: none; }
  iframe.ready { opacity: 1; pointer-events: auto; }
</style>
</head>
<body>
<div id="wait">
  <div>جارٍ فتح نظام الحضور والغياب…</div>
  <a id="direct" target="_top" rel="noopener">إذا لم يظهر النظام اضغط هنا</a>
</div>
<iframe credentialless title="نظام الحضور والغياب" allow="clipboard-write"></iframe>
<script>
  const APP = 'https://script.google.com/macros/s/AKfycbzsUaT9Y2fkIq37SrVLrX6EkMrhUFBm9YXGznF0RUxsh1G6QUMxw1Qgsi0Ywh4fyieO/exec';
  const frame = document.querySelector('iframe');
  document.getElementById('direct').href = APP;
  frame.onload = () => frame.classList.add('ready'); // حتى يبقى رابط البديل قابلاً للضغط أثناء التحميل
  frame.src = APP; // يُضبط بعد credentialless حتى يُطبَّق من أول طلب
</script>
</body>
</html>
